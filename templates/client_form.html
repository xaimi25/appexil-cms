{% extends "base.html" %}
{% block title %}{{ 'Edit' if client else 'Add' }} Client · Appexil CMS{% endblock %}
{% block content %}
<h1 class="pagetitle">{{ 'Edit Client' if client else 'Add Client' }}</h1>
<form method="post" class="form">
  <label>Full name *<input name="name" required value="{{ client['name'] if client else '' }}"></label>
  <label>CNIC / Passport<input name="cnic" value="{{ client['cnic'] if client else '' }}"></label>
  <label>Phone (with country code)<input name="phone" placeholder="+92 3XX XXXXXXX" value="{{ client['phone'] if client else '' }}"></label>
  <label>Email<input name="email" type="email" value="{{ client['email'] if client else '' }}"></label>
  <label>Service type<input name="service_type" placeholder="e.g. CDR Writing — Engineers Australia" value="{{ client['service_type'] if client else '' }}"></label>
  <label>Status<select name="status">{% for s in statuses %}<option {{ 'selected' if client and client['status']==s else '' }}>{{ s }}</option>{% endfor %}</select></label>
  <button class="btn primary" type="submit">{{ 'Save changes' if client else 'Add Client' }}</button>
  <a class="btn" href="{{ url_for('clients') }}">Cancel</a>
</form>
{% endblock %}
